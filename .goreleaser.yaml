version: 2

project_name: siesta

before:
  hooks:
    - go mod download

builds:
  # CLI binary (named "siesta") for laptops/servers.
  - id: cli
    main: ./cmd/siesta
    binary: siesta
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rahadiangg/siesta/internal/runner/cli.Version={{ .Version }}

  # FunctionGraph binary: same code, but named "handler" to match the Go1.x
  # console Handler default. Linux only; amd64 is the common FG runtime, arm64
  # for Kunpeng runtimes.
  - id: fg
    main: ./cmd/siesta
    binary: handler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rahadiangg/siesta/internal/runner/cli.Version={{ .Version }}

archives:
  # CLI archives, one per OS/arch.
  - id: cli
    ids: [cli]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # FunctionGraph package: a zip with `bootstrap` at the root, ready to upload.
  - id: functiongraph
    ids: [fg]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_functiongraph_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: rahadiangg
    name: siesta
